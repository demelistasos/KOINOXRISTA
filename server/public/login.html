<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Κοινόχρηστα">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>Κοινόχρηστα · Σύνδεση</title>
<style>
  :root { --ink:#16203a; --ink-2:#4a5674; --line:rgba(22,32,58,.12); --card:rgba(255,255,255,.62); --accent:#3b5bdb; --bad:#c92a2a; --bg:#eef1f8; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eef1fb; --ink-2:#a8b2cc; --line:rgba(255,255,255,.12); --card:rgba(24,30,46,.62); --accent:#7c94ff; --bad:#ff8787; --bg:#0f1420; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  .aurora { position: fixed; inset: -20%; z-index: 0; pointer-events: none; filter: blur(70px); opacity: .7;
    background: radial-gradient(40% 40% at 25% 30%, #8aa2ff 0, transparent 70%), radial-gradient(35% 35% at 75% 25%, #7de2d1 0, transparent 70%), radial-gradient(40% 40% at 60% 80%, #ffb3c7 0, transparent 70%); }
  @media (prefers-color-scheme: dark) { .aurora { opacity: .35; } }
  form { position: relative; z-index: 1; width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px 24px;
    -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 20px 60px rgba(20,30,60,.18); display: grid; gap: 14px; }
  .mark { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-weight: 800; font-size: 26px; color: #fff; background: linear-gradient(145deg, #5b7cff, #3b5bdb); box-shadow: 0 8px 20px rgba(59,91,219,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  h1 { margin: 4px 0 0; font-size: 22px; letter-spacing: -.01em; }
  p { margin: 0; color: var(--ink-2); }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  input { font: inherit; font-size: 16px; color: var(--ink); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.55); outline: none; }
  @media (prefers-color-scheme: dark) { input { background: rgba(0,0,0,.25); } }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button { font: inherit; font-weight: 700; font-size: 16px; padding: 13px; border: 0; border-radius: 12px; color: #fff; background: linear-gradient(180deg, #5b7cff, #3b5bdb); box-shadow: 0 6px 16px rgba(59,91,219,.35), inset 0 1px 0 rgba(255,255,255,.3); cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--bad); font-weight: 600; min-height: 1.2em; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<form id="f" autocomplete="on">
  <div class="mark">Κ</div>
  <h1 id="t">Κοινόχρηστα</h1>
  <p id="sub">Σύνδεση στον λογαριασμό σου.</p>
  <label>Όνομα<input name="name" id="name" autocomplete="username" required autocapitalize="words"></label>
  <label>Κωδικός<input name="password" id="pw" type="password" autocomplete="current-password" required minlength="6"></label>
  <label id="pw2l" hidden>Ξανά ο κωδικός<input name="password2" id="pw2" type="password" autocomplete="new-password" minlength="6"></label>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Σύνδεση</button>
</form>
<script src="/login.js"></script>
</body>
</html>
