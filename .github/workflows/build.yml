name: Build Κοινόχρηστα (Windows, Mac και server)

# Σε κάθε αλλαγή στο main φτιάχνεται νέα έκδοση 2.2.<αριθμός εκτέλεσης> και ανεβαίνει στα Releases με:
#   Koinoxrista-Windows-<V>-Setup.exe   (εγκατάσταση ΚΑΙ αυτόματη ενημέρωση στα Windows)
#   Koinoxrista-Mac-<V>.dmg             (πρώτη εγκατάσταση στο Mac)
#   Koinoxrista-Mac-<V>.zip             (αυτόματη ενημέρωση στο Mac)
#   Koinoxrista-Server-<V>.tar.gz       (αυτόματη ενημέρωση του server του σπιτιού)
#   SHA256SUMS.txt                      (η εφαρμογή ελέγχει ότι κατέβηκαν σωστά)
# Επίσης ανεβαίνει το image ghcr.io/demelistasos/koinoxrista (για το CasaOS).
#
# Το Mac χτίζεται ταυτόχρονα σε δύο είδη Mac του GitHub (Apple Silicon και Intel), γιατί συχνά δεν
# υπάρχουν διαθέσιμα. Αρκεί να πετύχει ένα. Αν δεν πετύχει κανένα, η έκδοση βγαίνει χωρίς Mac.
# Τότε: Actions → Run workflow και γράψε την έκδοση στο «mac_for_version» για να προστεθεί το Mac.
#
# Για νέα «μεγάλη» έκδοση αλλάζεις το 2.2 στη γραμμή V παρακάτω (π.χ. 2.3).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      mac_for_version:
        description: 'Μόνο Mac για υπάρχουσα έκδοση (π.χ. 2.2.7). Άφησε κενό για νέα κανονική έκδοση.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  V: ${{ inputs.mac_for_version || format('2.2.{0}', github.run_number) }}
  SRC_REF: ${{ inputs.mac_for_version && format('v{0}', inputs.mac_for_version) || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Δοκιμές υπολογισμών
        run: node --test test/calc.test.js
      - name: Έλεγχος σύνταξης
        run: for f in main.js preload.js updater.js src/*.js server/*.js server/public/*.js; do node --check "$f"; done

  build-windows:
    needs: test
    if: ${{ !inputs.mac_for_version }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Αριθμός έκδοσης
        shell: bash
        run: npm version "$V" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          if-no-files-found: error
          path: dist/Koinoxrista-Windows-*-Setup.exe

  build-mac:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Αριθμός έκδοσης
        shell: bash
        run: npm version "$V" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mac-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/Koinoxrista-Mac-*.dmg
            dist/Koinoxrista-Mac-*.zip

  build-server:
    needs: test
    if: ${{ !inputs.mac_for_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Αριθμός έκδοσης
        run: npm version "$V" --no-git-tag-version --allow-same-version
      - name: Πακέτο αυτόματης ενημέρωσης
        run: |
          mkdir -p dist
          tar -czf "dist/Koinoxrista-Server-$V.tar.gz" package.json LICENSE.md server src
          tar -tzf "dist/Koinoxrista-Server-$V.tar.gz" | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: dist-server
          if-no-files-found: error
          path: dist/Koinoxrista-Server-*.tar.gz
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image για δοκιμή
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: koinoxrista:test
      - name: Δοκιμή μέσα στο image (σύνδεση, αποθήκευση, PDF)
        run: |
          docker run -d --name kx -p 8080:8080 -e AUTO_UPDATE=0 koinoxrista:test
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          J='-H Content-Type:application/json -H Origin:http://localhost:8080'
          curl -fs -c c.txt $J -d '{"name":"Δοκιμή","password":"dokimi123"}' localhost:8080/api/setup
          curl -fs -b c.txt $J -X PUT -d '{"rev":0,"data":{"buildings":[],"prefs":{}}}' localhost:8080/api/data
          curl -fs -b c.txt $J -d '{"html":"<html><meta charset=utf-8><body><h1>Κοινόχρηστα 12,34 €</h1></body></html>","fileName":"test","building":"Δοκιμή","subdir":"2026-11"}' localhost:8080/api/pdf | tee r.json
          URL=$(node -e "console.log(require('./r.json').url)")
          curl -fs -b c.txt "localhost:8080$URL" -o t.pdf
          head -c 5 t.pdf | grep -q '%PDF' && echo "PDF εντάξει ($(stat -c %s t.pdf) bytes)"
          docker logs kx
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ανέβασμα image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Κοινόχρηστα
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            ghcr.io/demelistasos/koinoxrista:latest
            ghcr.io/demelistasos/koinoxrista:${{ env.V }}

  release:
    needs: [test, build-windows, build-mac, build-server]
    if: ${{ always() && !inputs.mac_for_version && needs.test.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: in
      - name: Δημοσίευση στα Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find in -type f -ls
          mkdir out
          W="Koinoxrista-Windows-$V-Setup.exe"
          cp "in/dist-windows/$W" out/ || { echo "Λείπει ο installer των Windows"; exit 1; }
          MACDIR=$(ls -d in/dist-mac-* 2>/dev/null | while read d; do [ -f "$d/Koinoxrista-Mac-$V.zip" ] && echo "$d" && break; done)
          if [ -n "$MACDIR" ]; then cp "$MACDIR/Koinoxrista-Mac-$V.zip" "$MACDIR/Koinoxrista-Mac-$V.dmg" out/; echo "Mac από: $MACDIR"
          else echo "::warning::Δεν χτίστηκε Mac. Τρέξε ξανά με mac_for_version=$V"; fi
          if [ -f "in/dist-server/Koinoxrista-Server-$V.tar.gz" ]; then cp "in/dist-server/Koinoxrista-Server-$V.tar.gz" out/
          else echo "::warning::Δεν χτίστηκε ο server"; fi
          (cd out && sha256sum Koinoxrista-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "v$V" out/* \
            --repo "${{ github.repository }}" \
            --title "Κοινόχρηστα $V" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "**Server (CasaOS):** ενημερώνεται μόνος του. · **Windows:** Koinoxrista-Windows-$V-Setup.exe · **Mac:** Koinoxrista-Mac-$V.dmg (την πρώτη φορά δεξί κλικ → Άνοιγμα). Αν έχεις ήδη την εφαρμογή (2.2 και μετά), ενημερώνεται μόνη της. Τα στοιχεία σου δεν χάνονται."

  attach-mac:
    needs: [test, build-mac]
    if: ${{ always() && inputs.mac_for_version && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-mac-*
          path: in
      - name: Προσθήκη του Mac στην έκδοση
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          find in -type f -ls
          MACDIR=$(ls -d in/dist-mac-* 2>/dev/null | while read d; do [ -f "$d/Koinoxrista-Mac-$V.zip" ] && echo "$d" && break; done)
          [ -n "$MACDIR" ] || { echo "Δεν χτίστηκε Mac. Δοκίμασε ξανά αργότερα."; exit 1; }
          mkdir out && cp "$MACDIR/Koinoxrista-Mac-$V.zip" "$MACDIR/Koinoxrista-Mac-$V.dmg" out/
          gh release download "v$V" --repo "$REPO" --pattern SHA256SUMS.txt --dir old
          (grep -v "Koinoxrista-Mac-$V" old/SHA256SUMS.txt || true) > out/SHA256SUMS.txt
          (cd out && sha256sum Koinoxrista-Mac-* >> SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "v$V" out/* --repo "$REPO" --clobber
